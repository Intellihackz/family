<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112"><g transform="translate(-8 -8)">
  
  <defs>
    <!-- one continuous F silhouette: chunky bars, fully rounded ends, softened inner corners -->
    <path id="f" d="M45 14H83A17 17 0 0 1 83 48H69A5 5 0 0 0 64 53A5 5 0 0 0 69 58H73A15 15 0 0 1 73 88H69A5 5 0 0 0 64 93V96A18 18 0 0 1 28 96V31A17 17 0 0 1 45 14Z"/>
    <clipPath id="clip"><use href="#f"/></clipPath>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="114">
      <stop offset="0" stop-color="#dde3df"/><stop offset=".5" stop-color="#a9b4ac"/><stop offset="1" stop-color="#7a877f"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="28" y1="14" x2="100" y2="114">
      <stop offset="0" stop-color="#8fcfa4"/><stop offset=".5" stop-color="#4e9a6a"/><stop offset="1" stop-color="#2a6544"/>
    </linearGradient>
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="46">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="114">
      <stop offset="0" stop-color="#00c805" stop-opacity="0"/><stop offset="1" stop-color="#00c805" stop-opacity=".28"/>
    </linearGradient>
  </defs>

  <!-- green rim: the silhouette stroked, so only its outer half shows once the body is on top -->
  <use href="#f" fill="url(#rim)" stroke="url(#rim)" stroke-width="5" stroke-linejoin="round"/>
  <!-- glass body -->
  <use href="#f" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <rect x="28" y="70" width="80" height="48" fill="url(#glow)"/>
    <rect x="28" y="14" width="80" height="34" fill="url(#gloss)"/>
    <!-- thin bright lip just inside the rim, like the reference's glass edge -->
    <use href="#f" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.6"/>
  </g>
</g></svg>
