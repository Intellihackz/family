      <stop offset="0" stop-color="#00c805" stop-opacity="0"/><stop offset="1" stop-color="#00c805" stop-opacity=".28"/>
    </linearGradient>
  </defs>

  <!-- green rim: the silhouette stroked, so only its outer half shows once the body is on top -->
  <use href="#f" fill="url(#rim)" stroke="url(#rim)" stroke-width="5" stroke-linejoin="round"/>
