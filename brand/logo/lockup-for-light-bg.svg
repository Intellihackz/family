      <stop offset="0" stop-color="#dde3df"/><stop offset=".5" stop-color="#a9b4ac"/><stop offset="1" stop-color="#7a877f"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="28" y1="14" x2="100" y2="114">
